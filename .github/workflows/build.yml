name: Build

# Construit et vérifie le paquet sur les PR et main.
# La publication APT est réservée à main (environnement prod) et ne part que si la
# variable de dépôt BOGLIETTI_APT_DEPLOY_ENABLED vaut true.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier sur le dépôt APT après les contrôles"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Même condensat que BUILD_IMAGE dans versions.env (vérifié par le test de cohérence).
  BUILD_IMAGE: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cohérence de l'image de build
        run: |
          . ./versions.env
          [ "$BUILD_IMAGE" = "$(grep -m1 '^  BUILD_IMAGE:' .github/workflows/build.yml | awk '{print $2}')" ]

      - name: Outils d'index APT
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg

      - name: Syntaxe des scripts
        run: for f in build.sh build/*.sh build/postinst tests/*.sh; do bash -n "$f"; done

      - name: Shellcheck
        run: shellcheck -S warning -s bash build.sh build/*.sh build/postinst tests/*.sh

      - name: Le contrôle SSE4/AVX refuse bien un binaire fautif
        run: docker run --rm --platform linux/amd64 -v "$PWD:/src:ro" "$BUILD_IMAGE" bash /src/tests/check-baseline-test.sh

      - name: Compiler le paquet
        run: ./build.sh

      - name: Vérifier les métadonnées publiques
        run: bash tests/public-surface-test.sh

      - name: Installation sur un Ubuntu 24.04 neuf
        run: docker run --rm --platform linux/amd64 -v "$PWD/dist:/dist:ro" -v "$PWD/tests:/tests:ro" "$BUILD_IMAGE" bash /tests/install-test.sh

      - name: Vérifier le dépôt APT signé avec une clé jetable
        run: bash tests/apt-repo-test.sh

      - name: Vérifier le déploiement SFTP simulé
        run: bash tests/deploy-apt-repo-test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owntone-deb
          path: dist/
          if-no-files-found: error

  native-build-and-install:
    name: ${{ matrix.target }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        target: [noble, resolute, trixie]
        arch: [amd64, arm64]
        include:
          - target: noble
            image: ubuntu:24.04
          - target: resolute
            image: ubuntu:26.04
          - target: trixie
            image: debian:13
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build on the target distribution and architecture
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
          PACKAGE_BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          mkdir -p dist
          docker run --rm -e "TARGET_CODENAME=$TARGET" -e "PACKAGE_BUILD_ID=$PACKAGE_BUILD_ID" -v "$PWD:/src:ro" -v "$PWD/dist:/out" "$IMAGE" bash /src/build/build-deb.sh
      - name: Install and check package
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/tests:/tests:ro" "$IMAGE" bash /tests/install-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  signed-repository-test:
    name: Assemble and verify signed test repository
    needs: native-build-and-install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: artifacts/
      - name: Prepare the six tested packages
        run: |
          for suite in noble resolute trixie; do
            for arch in amd64 arm64; do
              mkdir -p "dist/$suite/$arch"
              cp artifacts/package-"$suite"-"$arch"/*.deb "dist/$suite/$arch/"
            done
          done
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Generate throwaway signing key and repository
        run: bash tests/build-test-repository.sh dist "$RUNNER_TEMP/test-repo"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-test-repository
          path: ${{ runner.temp }}/test-repo/
          if-no-files-found: error
          retention-days: 1

  apt-installation-test:
    name: Signed APT install ${{ matrix.target }} / ${{ matrix.arch }}
    needs: signed-repository-test
    strategy:
      fail-fast: false
      matrix:
        target: [noble, resolute, trixie]
        arch: [amd64, arm64]
        include:
          - target: noble
            image: ubuntu:24.04
          - target: resolute
            image: ubuntu:26.04
          - target: trixie
            image: debian:13
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-test-repository
          path: test-repo/
      - name: Install the package through APT
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory test-repo > "$RUNNER_TEMP/apt-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for ((attempt=0; attempt<50; attempt++)); do
            if curl -fsS http://127.0.0.1:8765/boglietti-apt.gpg -o /dev/null; then break; fi
            sleep 0.2
          done
          docker run --rm --network host -e "TARGET=$TARGET" -v "$PWD/test-repo/boglietti-apt.gpg:/test-key.gpg:ro" -v "$PWD/tests:/tests:ro" "$IMAGE" bash /tests/install-from-apt.sh

  publish:
    name: Publier dans APT
    needs: [build, native-build-and-install, signed-repository-test, apt-installation-test]
    if: >-
      vars.BOGLIETTI_APT_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: artifacts/

      - name: Organiser les paquets testés
        run: |
          for suite in noble resolute trixie; do
            for arch in amd64 arm64; do
              mkdir -p "dist/$suite/$arch"
              cp artifacts/package-"$suite"-"$arch"/*.deb "dist/$suite/$arch/"
            done
          done

      - name: Outils de publication
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg lftp

      - name: Construire le dépôt APT signé
        env:
          APT_SIGNING_KEY: ${{ secrets.BOGLIETTI_APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.BOGLIETTI_APT_SIGNING_PASSPHRASE }}
          APT_SIGNING_FINGERPRINT: ${{ vars.BOGLIETTI_APT_FINGERPRINT }}
        run: bash build/make-apt-repo.sh dist "$RUNNER_TEMP/owntone-apt"

      - name: Déployer le dépôt par SFTP épinglé
        env:
          APT_SFTP_HOST: ${{ secrets.BOGLIETTI_APT_SFTP_HOST }}
          APT_SFTP_USER: ${{ vars.BOGLIETTI_APT_SFTP_USER }}
          APT_SFTP_PASSWORD: ${{ secrets.BOGLIETTI_APT_SFTP_PASSWORD }}
          APT_SFTP_KNOWN_HOSTS: ${{ secrets.BOGLIETTI_APT_SFTP_KNOWN_HOSTS }}
        run: bash build/deploy-apt-repo.sh "$RUNNER_TEMP/owntone-apt"

      - name: Vérifier le dépôt public par HTTPS et APT
        run: |
          for suite in noble resolute trixie; do
            for arch in amd64 arm64; do
              bash build/verify-apt-repo.sh https://boglietti.ovh/apt "$suite" "$RUNNER_TEMP/owntone-apt" "$arch"
            done
          done
