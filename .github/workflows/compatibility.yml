name: Compatibility investigation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-package:
    name: Build the existing Ubuntu 24.04 package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-ubuntu-package
          path: dist/*.deb
          if-no-files-found: error

  native-build-and-install:
    name: ${{ matrix.target }} / ${{ matrix.arch }}
    needs: original-package
    strategy:
      fail-fast: false
      matrix:
        target: [noble, resolute, trixie]
        arch: [amd64, arm64]
        include:
          - target: noble
            image: ubuntu:24.04
          - target: resolute
            image: ubuntu:26.04
          - target: trixie
            image: debian:13
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.arch == 'amd64'
        with:
          name: original-ubuntu-package
          path: original-dist
      - name: Check the existing Ubuntu package on this distribution
        if: matrix.arch == 'amd64'
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
        run: |
          if docker run --rm -v "$PWD/original-dist:/dist:ro" -v "$PWD/tests:/tests:ro" "$IMAGE" bash /tests/install-test.sh; then
            echo "Original Ubuntu 24.04 package on $TARGET: installation test passed" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Original Ubuntu 24.04 package on $TARGET: installation test failed" | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ "$TARGET" == noble ]]; then
              exit 1
            fi
            echo "::warning::The existing Ubuntu 24.04 package did not pass the installation test on $TARGET; see the logs."
          fi
      - name: Build on the target distribution and architecture
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          docker run --rm -e "TARGET_CODENAME=$TARGET" -v "$PWD:/src:ro" -v "$PWD/dist:/out" "$IMAGE" bash /src/build/build-deb.sh
      - name: Install and check package
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/tests:/tests:ro" "$IMAGE" bash /tests/install-test.sh
